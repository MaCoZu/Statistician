[metadata]
name = statistician
version = 0.1.0
author = Marco Zausch
author_email = marcoz@posteo.de
description = A Python package for statistical analysis and hypothesis testing
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/MaCoZu/statistician
project_urls =
    Bug Tracker = https://github.com/MaCoZu/statistician/issues
    Documentation = https://github.com/MaCoZu/statistician#readme
    Source Code = https://github.com/MaCoZu/statistician
    Changelog = https://github.com/MaCoZu/statistician/blob/main/CHANGELOG.md
license = MIT
license_files = LICENSE
classifiers =
    Development Status :: 3 - Alpha
    Intended Audience :: Developers
    Intended Audience :: Science/Research
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Scientific/Engineering
    Topic :: Scientific/Engineering :: Mathematics
    Topic :: Software Development :: Libraries :: Python Modules
    Typing :: Typed

[options]
packages = find:
python_requires = >=3.8
install_requires =
    numpy>=1.20.0
    pandas>=1.2.0
    scipy>=1.6.0
include_package_data = True
zip_safe = False

[options.packages.find]
exclude =
    tests*
    docs*
    examples*

[options.extras_require]
dev =
    pytest>=7.0.0
    pytest-cov>=4.0.0
    black>=23.0.0
    flake8>=6.0.0
    mypy>=1.0.0
    isort>=5.12.0
    build>=0.10.0
    twine>=4.0.0

[bdist_wheel]
universal = 0

[flake8]
max-line-length = 100
exclude = 
    .git,
    __pycache__,
    build,
    dist,
    .eggs,
    *.egg-info,
    .venv,
    venv,
    statistician/bin,
    statistician/include,
    statistician/lib
ignore = E203, E266, E501, W503
max-complexity = 10

[tool:pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --cov=statistician
    --cov-report=term-missing
    --cov-report=html

[coverage:run]
source = statistician
omit = 
    */tests/*
    */statistician/bin/*
    */statistician/include/*
    */statistician/lib/*

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING: